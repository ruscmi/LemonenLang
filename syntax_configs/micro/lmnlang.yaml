filetype: lmnlang

detect:
    filename: "(\\.lmn$|/LemonenLang/libs/.+)"

rules:
    - statement: "\\b(if|else|while|break|continue|func|return)\\b"
    
    - symbol.operator: "\\b(lmuck|lmport|lmout|lmtod|lmtype|lmlen|lmpush)\\b"
    
    - constant.bool: "\\b(true|false)\\b"
    
    - constant.number: "\\b[0-9]+(\\.[0-9]+)?\\b"
    
    - string: "\"(\\\\.|[^\"])*\""
    
    - comment: "//.*"

    - comment: "/--.*/"
    
    - symbol: "[\\[\\]()\\{\\}]"
    
    - symbol.operator: "(\\+|\\-|\\*|\\/|%|=|==|!=|<|>|<=|>=|&&|\\|\\||!)"
